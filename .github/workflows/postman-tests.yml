name: Testes

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-html

      - name: Create reports directory
        run: mkdir -p reportsTest

      - name: Run Collections
        run: |
          newman run collections/atualizar_usuario.json \
            -e environments/postman_environment.json \
            --reporters cli,junit,html \
            --reporter-junit-export reportsTest/atualizar_usuario.xml \
            --reporter-html-export reportsTest/atualizar_usuario.html
			
          newman run collections/criar_usuario.json \
            -e environments/postman_environment.json \
            --reporters cli,junit,html \
            --reporter-junit-export reportsTest/criar_usuario.xml \
            --reporter-html-export reportsTest/criar_usuario.html
			
          newman run collections/listar_usuario.json \
            -e environments/postman_environment.json \
            --reporters cli,junit,html \
            --reporter-junit-export reportsTest/listar_usuario.xml \
            --reporter-html-export reportsTest/listar_usuario.html
			
          newman run collections/deletar_usuario.json \
            -e environments/postman_environment.json \
            --reporters cli,junit,html \
            --reporter-junit-export reportsTest/deletar_usuario.xml \
            --reporter-html-export reportsTest/deletar_usuario.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-reports
          path: reportsTest/

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reportsTest/*.xml
